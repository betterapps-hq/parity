name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # pnpm verify on each system, through the shared template. A newer push to the same branch or pull request cancels
  # the run before it.
  verify:
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@c3b85f070cf22fbf7a4dae841461f82e2b16ea20 # v1.2.0
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      # The detection tests need every project in fixtures/ installed, each with its own package manager. Their
      # node_modules come back from the cache while their lockfiles are unchanged, and npm ci would delete them, so
      # they're installed only when one is missing. Bun (for mantine) and Corepack (which brings react-aria's Yarn)
      # come from npm at pinned versions, the same on every system. install-projects installs only the projects
      # generate.ts makes; the others in fixtures/ are npm projects, installed from their lockfiles after it.
      prepare: |
        missing=
        for project in fixtures/*/; do
          if [ ! -d "${project}node_modules" ]; then missing=1; fi
        done
        if [ -n "$missing" ]; then
          tools=$(mktemp -d)
          npm install --prefix "$tools" --no-audit --no-fund bun@1.4.3 corepack@0.35.0
          export PATH="$tools/node_modules/.bin:$PATH"
          pnpm --filter @parity/fixtures install-projects
          for project in fixtures/*/; do
            if [ ! -d "${project}node_modules" ]; then (cd "$project" && npm ci --no-audit --no-fund); fi
          done
        else
          echo "Every fixture project came from the cache."
        fi
      cache-path: fixtures/*/node_modules
      cache-key-files: fixtures/*/*lock*
      # Then the CLI's packed tarball, installed in an empty folder, has to run on each system (PAR-13).
      command: |
        pnpm verify
        pnpm --filter @parity-app/cli try-packed
      # A run that installs the fixture projects and caches their 2 GB can outlast the default 30 minutes on Windows.
      timeout-minutes: 45
      # Vite Task's cache isn't kept between runs: pnpm verify runs vp check and vp test directly, not through vp run.

  # What needs only one system and the branch's history: types, and on pull requests the change files Beachball and
  # scripts/changes.ts check, and the title squash merging makes the commit's subject. Both compare with origin/main,
  # which a shallow checkout doesn't have. The title comes from the event's file, never through an expression.
  checks:
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@c3b85f070cf22fbf7a4dae841461f82e2b16ea20 # v1.2.0
    with:
      fetch-depth: 0
      # A group of its own, so it never cancels verify's run on Ubuntu.
      concurrency-key: checks-${{ github.ref }}
      command: |
        pnpm check:types
        if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          # Beachball rejects its own release commit, which scripts/changes.ts accepts. Only this repository's own
          # beachball/release branch skips it, since a fork can name a branch anything.
          head_repo=$(jq -r .pull_request.head.repo.full_name "$GITHUB_EVENT_PATH")
          if [ "$GITHUB_HEAD_REF" != beachball/release ] || [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            pnpm exec beachball check
          fi
          node scripts/changes.ts check --committed
          node scripts/commits.ts title "$(jq -r .pull_request.title "$GITHUB_EVENT_PATH")"
        fi

  # The one check the main branch's ruleset requires, so it needn't change when jobs or systems do.
  ci-passes:
    name: CI passes
    if: always()
    needs: [verify, checks]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Every job passed."
