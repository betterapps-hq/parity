name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # pnpm verify on each system, through the shared template, and the CLI's packed tarball installed in an empty folder
  # (PAR-13). What only one system checks runs beside it, in a job per system below (PAR-1010). A newer push to the
  # same branch or pull request cancels the run before it.
  verify:
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@main
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      # The detection tests need every project in fixtures/ installed, each with its own package manager. Their
      # node_modules come back from the cache while their lockfiles are unchanged, and npm ci would delete them, so
      # they're installed only when one is missing. Bun (for mantine) and Corepack (which brings react-aria's Yarn)
      # come from npm at pinned versions, the same on every system.
      prepare: |
        # Electron's binary and what electron-builder downloads to package it go where the cache keeps them. Electron
        # is installed here, with up to 3 tries, since whatever first loads it would otherwise download it with one (PAR-789).
        # Outside the checkout, whose package.json would make the scripts electron-builder unpacks there ES modules.
        home=$(node -p "require('os').homedir()")
        echo "electron_config_cache=$home/.cache/parity-ci/electron" >> "$GITHUB_ENV"
        echo "ELECTRON_BUILDER_CACHE=$home/.cache/parity-ci/electron-builder" >> "$GITHUB_ENV"
        export electron_config_cache="$home/.cache/parity-ci/electron"
        node scripts/retry.ts pnpm --filter @parity-app/desktop exec install-electron
        missing=
        for project in fixtures/*/; do
          if [ ! -d "${project}node_modules" ]; then missing=1; fi
        done
        if [ -n "$missing" ]; then
          tools=$(mktemp -d)
          npm install --prefix "$tools" --no-audit --no-fund bun@1.4.3 corepack@0.35.0
          export PATH="$tools/node_modules/.bin:$PATH"
          pnpm --filter @parity-app/fixtures install-projects
        else
          echo "Every fixture project came from the cache."
        fi
      # Electron's downloads share the fixtures' cache and its key, as the template keeps one. After Electron's version
      # changes, the new one downloads on each run until a fixture's lockfile changes too.
      cache-path: |
        fixtures/*/node_modules
        ~/.cache/parity-ci/electron
        ~/.cache/parity-ci/electron-builder
      cache-key-files: fixtures/*/*lock*
      command: |
        pnpm verify
        pnpm --filter @parity-app/cli try-packed
      # A run that installs the fixture projects and caches their 2 GB can outlast the default 30 minutes on Windows.
      timeout-minutes: 45
      # pnpm verify runs the check and test tasks through vp run, so their cache is kept between runs, under each
      # system's newest. checks doesn't keep one: its types task would save only about 4 seconds.
      vite-task-cache: true

  # The Windows app, built, packaged and installed as people get it, then updated. Every installer target must build
  # before a change can merge; signing is a separate release task. Its bundles and source maps go to the sourcemaps job.
  app-windows:
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@main
    with:
      os: '["windows-latest"]'
      # A group of its own, so it never cancels verify's run on the same system.
      concurrency-key: app-${{ github.ref }}
      # The start and update checks open fixture projects, so this installs them as verify does, from the same cache.
      prepare: |
        # Electron's binary and what electron-builder downloads to package it go where the cache keeps them. Electron
        # is installed here, with up to 3 tries, since whatever first loads it would otherwise download it with one (PAR-789).
        # Outside the checkout, whose package.json would make the scripts electron-builder unpacks there ES modules.
        home=$(node -p "require('os').homedir()")
        echo "electron_config_cache=$home/.cache/parity-ci/electron" >> "$GITHUB_ENV"
        echo "ELECTRON_BUILDER_CACHE=$home/.cache/parity-ci/electron-builder" >> "$GITHUB_ENV"
        export electron_config_cache="$home/.cache/parity-ci/electron"
        node scripts/retry.ts pnpm --filter @parity-app/desktop exec install-electron
        missing=
        for project in fixtures/*/; do
          if [ ! -d "${project}node_modules" ]; then missing=1; fi
        done
        if [ -n "$missing" ]; then
          tools=$(mktemp -d)
          npm install --prefix "$tools" --no-audit --no-fund bun@1.4.3 corepack@0.35.0
          export PATH="$tools/node_modules/.bin:$PATH"
          pnpm --filter @parity-app/fixtures install-projects
        else
          echo "Every fixture project came from the cache."
        fi
      # Electron's downloads share the fixtures' cache and its key, as the template keeps one. After Electron's version
      # changes, the new one downloads on each run until a fixture's lockfile changes too.
      cache-path: |
        fixtures/*/node_modules
        ~/.cache/parity-ci/electron
        ~/.cache/parity-ci/electron-builder
      cache-key-files: fixtures/*/*lock*
      command: |
        pnpm build
        # The startup check launches the production app only in CI, outside the checkout and without a dev server.
        pnpm --filter @parity-app/desktop try-built vite7-js
        pnpm --filter @parity-app/desktop try-built headless
        export CSC_IDENTITY_AUTO_DISCOVERY=false
        node scripts/retry.ts pnpm --filter @parity-app/desktop package
        pnpm --filter @parity-app/desktop try-installed
        # Real N -> N+1 updates, including corrupt downloads and unsaved-work cancellation.
        pnpm --filter @parity-app/desktop try-update
      # A run that installs the fixture projects can outlast the default 30 minutes on Windows, as verify's can.
      timeout-minutes: 45
      artifact-path: apps/desktop/sourcemaps
      artifact-name: desktop-sourcemaps
      artifact-retention-days: 7

  # The Linux app, packaged, then updated from one real version to the next.
  app-linux:
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@main
    with:
      os: '["ubuntu-latest"]'
      # A group of its own, so it never cancels verify's run on the same system.
      concurrency-key: app-${{ github.ref }}
      # The start and update checks open fixture projects, so this installs them as verify does, from the same cache.
      prepare: |
        # Electron's binary and what electron-builder downloads to package it go where the cache keeps them. Electron
        # is installed here, with up to 3 tries, since whatever first loads it would otherwise download it with one (PAR-789).
        # Outside the checkout, whose package.json would make the scripts electron-builder unpacks there ES modules.
        home=$(node -p "require('os').homedir()")
        echo "electron_config_cache=$home/.cache/parity-ci/electron" >> "$GITHUB_ENV"
        echo "ELECTRON_BUILDER_CACHE=$home/.cache/parity-ci/electron-builder" >> "$GITHUB_ENV"
        export electron_config_cache="$home/.cache/parity-ci/electron"
        node scripts/retry.ts pnpm --filter @parity-app/desktop exec install-electron
        missing=
        for project in fixtures/*/; do
          if [ ! -d "${project}node_modules" ]; then missing=1; fi
        done
        if [ -n "$missing" ]; then
          tools=$(mktemp -d)
          npm install --prefix "$tools" --no-audit --no-fund bun@1.4.3 corepack@0.35.0
          export PATH="$tools/node_modules/.bin:$PATH"
          pnpm --filter @parity-app/fixtures install-projects
        else
          echo "Every fixture project came from the cache."
        fi
      # Electron's downloads share the fixtures' cache and its key, as the template keeps one. After Electron's version
      # changes, the new one downloads on each run until a fixture's lockfile changes too.
      cache-path: |
        fixtures/*/node_modules
        ~/.cache/parity-ci/electron
        ~/.cache/parity-ci/electron-builder
      cache-key-files: fixtures/*/*lock*
      command: |
        pnpm build
        export CSC_IDENTITY_AUTO_DISCOVERY=false
        node scripts/retry.ts pnpm --filter @parity-app/desktop package
        xvfb-run -a pnpm --filter @parity-app/desktop try-update

  # The macOS app, packaged for both chips.
  app-macos:
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@main
    with:
      os: '["macos-latest"]'
      # A group of its own, so it never cancels verify's run on the same system.
      concurrency-key: app-${{ github.ref }}
      prepare: |
        # Electron's binary and what electron-builder downloads to package it go where the cache keeps them. Electron
        # is installed here, with up to 3 tries, since whatever first loads it would otherwise download it with one (PAR-789).
        # Outside the checkout, whose package.json would make the scripts electron-builder unpacks there ES modules.
        home=$(node -p "require('os').homedir()")
        echo "electron_config_cache=$home/.cache/parity-ci/electron" >> "$GITHUB_ENV"
        echo "ELECTRON_BUILDER_CACHE=$home/.cache/parity-ci/electron-builder" >> "$GITHUB_ENV"
        export electron_config_cache="$home/.cache/parity-ci/electron"
        node scripts/retry.ts pnpm --filter @parity-app/desktop exec install-electron
      cache-path: |
        ~/.cache/parity-ci/electron
        ~/.cache/parity-ci/electron-builder
      # Electron's version is in the app's package.json, so its downloads are fetched again when that changes.
      cache-key-files: apps/desktop/package.json
      command: |
        pnpm build
        export CSC_IDENTITY_AUTO_DISCOVERY=false
        node scripts/retry.ts pnpm --filter @parity-app/desktop package

  # What needs only one system and the branch's history: types, and on pull requests the change files Beachball and
  # scripts/changes.ts check, and the title squash merging makes the commit's subject. Both compare with origin/main,
  # which a shallow checkout doesn't have. The title comes from the event's file, never through an expression.
  checks:
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@main
    with:
      fetch-depth: 0
      # A group of its own, so it never cancels verify's run on Ubuntu.
      concurrency-key: checks-${{ github.ref }}
      command: |
        pnpm check:types
        # Unused files, dependencies and exports, which knip reads from knip.jsonc.
        pnpm check:unused
        if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          # Beachball expects pending change files. An already-consumed release instead proves its newer version
          # and matching generated changelog; ordinary PRs retain Beachball's own change-file validation.
          if ! node scripts/changes.ts releasing --committed; then
            pnpm exec beachball check
          fi
          # Check bundled packages too, accepting either pending change files or a consumed release with a newer
          # version and matching generated changelog. This also supports releasing a fix in its own PR.
          node scripts/changes.ts check --committed
          node scripts/commits.ts title "$(jq -r .pull_request.title "$GITHUB_EVENT_PATH")"
        fi

  # Sends the Windows build's source maps to Sentry, so events from the copies CI starts resolve to source (PAR-625).
  # Their release is the commit; only main's commits are tied to it, since a pull request's merge commit isn't kept.
  # Forks' pull requests get no secrets, so it skips them. A failed upload only leaves those events unresolved, so it
  # never fails CI's run, which cd-desktop.yml and cd-npm.yml wait on, and `CI passes` leaves it out.
  sourcemaps:
    name: Upload source maps
    needs: app-windows
    if: >-
      needs.app-windows.outputs.artifact-name != '' && (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: betterapps-hq/pipelines/github/actions/setup@main
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.app-windows.outputs.artifact-name }}
          path: apps/desktop/sourcemaps
      - name: Upload to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          LINK_COMMITS: ${{ github.event_name == 'push' && '--link-commits' || '' }}
        run: node scripts/upload-sourcemaps.ts apps/desktop --project parity-desktop $LINK_COMMITS

  # The one check the main branch's ruleset requires, so it needn't change when jobs or systems do.
  ci-passes:
    name: CI passes
    if: always()
    needs: [verify, app-windows, app-linux, app-macos, checks]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Every job passed."
