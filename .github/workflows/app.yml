name: App tests

# The editor's end-to-end tests (PAR-436), which open a copy of Parity on the example and drive it. On Windows, whose
# runners have a desktop to open its window on; Linux would need a virtual display. A workflow of its own until they
# run reliably on the runner (PAR-438): a failing job in CI would fail CI's run, which cd-npm.yml and cd-desktop.yml
# wait on, though `CI passes` leaves it out. Then it moves back into CI, and `CI passes` waits for it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@main
    with:
      os: '["windows-latest"]'
      # Electron is installed before the tests start it, with up to 3 tries, into a folder kept until the lockfile
      # changes, since GitHub's releases time out now and then (PAR-789).
      prepare: |
        echo "electron_config_cache=$GITHUB_WORKSPACE/.cache/electron" >> "$GITHUB_ENV"
        export electron_config_cache="$GITHUB_WORKSPACE/.cache/electron"
        node scripts/retry.ts pnpm --filter @parity-app/desktop exec install-electron
      cache-path: .cache/electron
      cache-key-files: pnpm-lock.yaml
      command: pnpm test:app
