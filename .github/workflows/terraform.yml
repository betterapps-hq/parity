name: Terraform

on:
  workflow_dispatch:
  pull_request:
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

# infra/github, the repository's rulesets, through the shared templates. The state bucket and its R2 endpoint are
# repository variables. Until they and the credentials exist, the templates validate the project and skip the plan with
# a notice.
jobs:
  plan:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: betterapps-hq/pipelines/.github/workflows/terraform-plan.yml@127016e9eaa157353b3f5ddbe82a32564a28cc08 # v1.7.0
    with:
      working-directory: infra/github
      state-bucket: ${{ vars.TF_STATE_BUCKET }}
      state-endpoint: ${{ vars.TF_STATE_ENDPOINT }}
    # Read-only credentials, since any branch's pull request plans with them.
    secrets:
      TF_STATE_ACCESS_KEY_ID: ${{ secrets.TF_STATE_READ_ACCESS_KEY_ID }}
      TF_STATE_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_READ_SECRET_ACCESS_KEY }}
      TF_GITHUB_TOKEN: ${{ secrets.TF_GITHUB_READ_TOKEN }}

  # Forward selected organization/repository credentials. Environment secrets, when present, override them.
  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: betterapps-hq/pipelines/.github/workflows/terraform-apply.yml@cfe6a66143f19e96a69eb54ee703ec3d052d37a7 # v1.10.0
    with:
      environment: infrastructure
      working-directory: infra/github
      state-bucket: ${{ vars.TF_STATE_BUCKET }}
      state-endpoint: ${{ vars.TF_STATE_ENDPOINT }}
    secrets:
      TF_STATE_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      TF_STATE_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      TF_GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
