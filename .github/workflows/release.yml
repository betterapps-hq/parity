name: Release

# Beachball's release pull request, through the shared templates (PAR-10). After CI passes on main, release-prepare opens
# a pull request with the versions and changelogs `beachball bump` writes from the change files, or updates the open one,
# and release-merge turns on auto-merge, so it merges once main's rules are met. Its version changes then start
# cd-npm.yml. Both push and merge with the release GitHub App, since what the job's own token pushes or merges starts no
# workflows. Until its RELEASE_APP_CLIENT_ID variable and RELEASE_APP_PRIVATE_KEY secret exist, both skip with a notice.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    # CI's runs for pushes to main only, never a pull request's branch that happens to be called main.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    uses: betterapps-hq/pipelines/.github/workflows/release-prepare.yml@ed34ffcba2ef6748b0210c763582e8995c81501b # v1.6.0
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  merge:
    needs: prepare
    if: needs.prepare.outputs.pull-request != ''
    uses: betterapps-hq/pipelines/.github/workflows/release-merge.yml@ed34ffcba2ef6748b0210c763582e8995c81501b # v1.6.0
    with:
      pull-request: ${{ fromJSON(needs.prepare.outputs.pull-request) }}
      head-sha: ${{ needs.prepare.outputs.head-sha }}
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
