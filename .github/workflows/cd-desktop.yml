name: CD desktop

# Delivers the desktop app on its own, apart from the CLI that cd-npm.yml releases to npm (PAR-10). Once CI passes on
# main, `version` bumps the app's version and changelog from its change files, then commits, tags and pushes them to
# main with the desktop environment's RELEASE_DEPLOY_KEY, the one actor main's ruleset lets skip a pull request. CI's run
# on that commit starts this workflow again, and `release` publishes the new version to GitHub Releases as a beta, which
# production then waits on its owner to approve.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Publish a beta or promote an existing beta without rebuilding.
        type: choice
        options: [release, promote]
        default: release
      version:
        description: Existing beta version to promote, without v. Unused for release.
        type: string

permissions:
  contents: read

jobs:
  # Beachball publishes every package it versions, so the shared cd-desktop-version template runs it scoped to
  # apps/desktop, in the desktop environment, with publishing off. It versions only for CI's run on a push to main, and
  # only while that commit is still main's head: a newer commit's own run versions it.
  version:
    name: Version
    permissions:
      contents: read
      # The template's job asks for it, for npm, though with publishing off nothing here uses it.
      id-token: write
    uses: betterapps-hq/pipelines/.github/workflows/cd-desktop-version.yml@main
    secrets:
      RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}

  release:
    name: Publish beta
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.action == 'release') || (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: write
      actions: read
    uses: betterapps-hq/pipelines/.github/workflows/cd-desktop-release.yml@main
    with:
      ci-workflow: ci.yml
      build-secret-env: VITE_TLDRAW_LICENSE_KEY
      build-command: PARITY_RELEASE_CHANNEL=beta pnpm build
    secrets:
      BUILD_SECRET: ${{ secrets.VITE_TLDRAW_LICENSE_KEY }}

  beta:
    name: Beta available
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: beta
      url: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.release.outputs.version }}
    steps:
      - name: Link the published beta
        env:
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.release.outputs.version }}
        run: echo "Beta downloads are available at $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Production
    needs: [release, beta]
    # Publishing a beta immediately queues the protected production deployment for its owner to approve.
    # Manual promotion remains available for an older beta; its release job is intentionally skipped.
    if: >-
      always() && ((github.event_name == 'workflow_dispatch' && inputs.action == 'promote') ||
      (needs.release.outputs.published == 'true' && needs.beta.result == 'success'))
    permissions:
      contents: write
    uses: betterapps-hq/pipelines/.github/workflows/cd-desktop-promote.yml@main
    with:
      version: ${{ needs.release.outputs.version || inputs.version }}
      environment: production
