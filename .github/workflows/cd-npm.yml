name: CD npm

# Publishes to npm the versions it doesn't have yet, through the shared template (PAR-14): after CI passes on main, which
# a merged release pull request's new versions reach. It uses npm's trusted publishing, with provenance and no token. npm
# trusts this file by name, so it must stay .github/workflows/cd-npm.yml: @parity-app/cli's trusted publisher on
# npmjs.com names it, with the npm environment, which infra/github keeps to main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A run by hand publishes only from main, and only a commit CI passed on as a push to main, which the template checks
  # through ci-workflow. Re-run also retries a failed publish, with the CI run it started from.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # CI's runs for pushes to main only, never a pull request's branch that happens to be called main.
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      # Reads CI's runs, to check a run by hand publishes a commit CI passed on.
      actions: read
      # npm's trusted publishing exchanges the run's OIDC token for a short-lived one, and signs provenance with it.
      id-token: write
    uses: betterapps-hq/pipelines/.github/workflows/cd-npm-publish.yml@d8e6eeab409f6bd88c691c1685e2a1fb1608d146 # v1.7.1
    with:
      # The desktop app is versioned but not published, so only packages with a publishConfig go: the CLI.
      require-publish-config: true
      environment: npm
      ci-workflow: ci.yml
