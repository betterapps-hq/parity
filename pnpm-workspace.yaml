packages:
  - apps/*
  - packages/*
  - examples/*
allowBuilds:
  electron: true
  esbuild: true
  # NSIS is used on Windows; electron-builder's optional Squirrel backend does not need its setup script.
  electron-winstaller: false
  msw: false
  # sentry-cli's binary comes from its platform package; its install script only downloads one when that is missing.
  "@sentry/cli": false
  # workerd, the Workers runtime Wrangler runs locally, comes from its platform package too.
  workerd: false
minimumReleaseAgeExclude:
  - electron@45.1.0
  - "@tldraw/driver@5.5.4"
  - "@tldraw/editor@5.5.4"
  - "@tldraw/state-react@5.5.4"
  - "@tldraw/state@5.5.4"
  - "@tldraw/store@5.5.4"
  - "@tldraw/tlschema@5.5.4"
  - "@tldraw/utils@5.5.4"
  - "@tldraw/validate@5.5.4"
  - tldraw@5.5.4
  - rulesync@43.5.0
  - skills@1.7.6
  - "@buildkitgg/shadcn-baseui-nova@0.5.0"
  - "@buildkitgg/storybook-config@0.2.0"
  - "@cloudflare/vite-plugin@1.69.0"
  - miniflare@5.20261110.1-beta
  - wrangler@4.160.1
  - "@better-apps/identity-workos@0.1.0"
  - better-apps@0.1.0
verifyDepsBeforeRun: error
# pnpm shortens node_modules/.pnpm's folder names to 60 characters on Windows and 120 elsewhere. The same length on every
# system keeps the source maps' paths, and so each bundle's Sentry debug ID, the same, so maps built on Ubuntu match
# the Windows installer's bundles (PAR-685).
virtualStoreDirMaxLength: 60
catalogMode: prefer
# Versions set once for the workspace. Reference them with "catalog:".
catalog:
  "@buildkitgg/oxlint-config": 0.1.0
  "@buildkitgg/shadcn-baseui-kit": npm:@buildkitgg/shadcn-baseui-nova@0.5.0
  "@buildkitgg/storybook-config": 0.2.0
  "@sentry/cli": 3.8.2
  "@sentry/electron": 8.3.0
  "@sentry/node": 11.11.0
  "@webref/css": 8.7.8
  beachball: 2.66.0
  css-tree: 3.2.1
  electron-builder: 26.18.0
  electron-updater: 6.8.11
  jiti: 2.7.0
  knip: 6.45.0
  sharp: 0.35.5
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  web-features: 3.45.0
  zod: 4.6.7
# Vite+ runs on its own core, so every package's Vite is that core, apart from two that stand in for or drive a
# customer's project and keep stock Vite: the example project, and builder-vite, whose tests start a stock Vite server.
overrides:
  vite@*: "catalog:"
  shadcn-vite>vite: ^8.3.5
  "@parity-app/builder-vite>vite": ^8.3.5
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
