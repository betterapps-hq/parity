nodeLinker: pnp
enableGlobalCache: false

# Fluent's packages use react-dom and scheduler without passing those peers down from @fluentui/react-components, which
# Plug'n'Play enforces. Each package that imports one gets it as a dependency, which resolves to the app's own copy.
packageExtensions:
  "@fluentui/react-context-selector@*":
    dependencies:
      scheduler: "^0.27.0"
  "@fluentui/react-portal@*":
    dependencies:
      react-dom: "^19.2.0"
  "@fluentui/react-combobox@*":
    dependencies:
      react-dom: "^19.2.0"
  "@fluentui/react-tag-picker@*":
    dependencies:
      react-dom: "^19.2.0"
  "@fluentui/react-tree@*":
    dependencies:
      react-dom: "^19.2.0"
  "@fluentui/react-virtualizer@*":
    dependencies:
      react-dom: "^19.2.0"
