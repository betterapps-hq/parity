<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Parity</title>
  <!--
    Code's angle brackets closing into the diamond design tools mark components with, around the component itself:
    in Parity, a component in your code is the one you design with. Drawn for 48 pixels and up;
    parity-icon-small.svg is drawn for 16 to 32.
  -->
  <defs>
    <linearGradient id="tile" x1="96" y1="48" x2="928" y2="976" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8A74FF"/>
      <stop offset="0.5" stop-color="#5432E6"/>
      <stop offset="1" stop-color="#2C129E"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.25" cy="0" r="0.85">
      <stop stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glow" x1="425" y1="425" x2="599" y2="599" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54D8F4"/>
      <stop offset="0.5" stop-color="#7A7EFF"/>
      <stop offset="1" stop-color="#D85CE1"/>
    </linearGradient>
    <filter id="halo" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#sheen)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="230" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4"/>

  <!-- The brackets, < and >, nearly closed. -->
  <path d="M468 266L222 512L468 758M556 266L802 512L556 758" stroke="#FFFFFF" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The component, lit in Parity's colors. -->
  <path d="M512 425L599 512L512 599L425 512Z" fill="url(#glow)" stroke="url(#glow)" stroke-width="72" stroke-linejoin="round" opacity="0.9" filter="url(#halo)"/>
  <path d="M512 425L599 512L512 599L425 512Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="42" stroke-linejoin="round"/>
</svg>
